[project]
name = "syncforge"
version = "1.7.1"
description = "Batch merge and synchronize audio and subtitle tracks in a desktop GUI"
readme = "README.md"
authors = [
    { name = "itsmrma", email = "m.benassi30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pyinstaller>=6.22.3",
    "scipy>=1.18.1",
    "pywebview>=6.2.1",
    "notify-py>=0.3.43,<0.4",
    "ffsubsync>=0.4.30,<0.5",
    "pywebview[pyside6]>=6.2.1 ; sys_platform == 'linux'",
]

[project.scripts]
syncforge = "syncforge:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
