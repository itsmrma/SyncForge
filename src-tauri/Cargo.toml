[package]
name = "syncforge"
version = "3.5.4"
description = "Batch merge and synchronize audio and subtitle tracks in a native Rust + Tauri v2 desktop GUI and CLI"
authors = ["itsmrma <m.benassi30@gmail.com>"]
edition = "2021"
rust-version = "1.90"
default-run = "SyncForge"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:rfd", "dep:tauri-build", "dep:tauri-plugin-updater"]

[lib]
name = "syncforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "SyncForge"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "syncforge-cli"
path = "src/bin/syncforge-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", optional = true }
hound = "3.5"
rustfft = "6.2"
tempfile = "3.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }
