name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Build and test shared Web GUI
      working-directory: web
      run: |
        npm ci
        npm run lint
        npm run build
        npx playwright install --with-deps --only-shell chromium
        npm test
    - uses: actions/upload-artifact@v7
      with:
        name: web-frontend
        path: src/syncforge/web/dist/
        if-no-files-found: error
        retention-days: 7

  build:
    name: Build on ${{ matrix.os }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            executable: SyncForge.exe
            os_label: Windows
            ext: .exe
          - os: ubuntu-latest
            executable: SyncForge
            os_label: Linux
            ext: ""
          - os: macos-latest
            executable: SyncForge
            os_label: macOS
            ext: ""

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Restore tested frontend
      uses: actions/download-artifact@v8
      with:
        name: web-frontend
        path: src/syncforge/web/dist/

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --locked --group build

    - name: Install media tools (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install mkvtoolnix ffmpeg -y --no-progress
        "$env:ProgramFiles\MKVToolNix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install media tools (Linux)
      if: runner.os == 'Linux'
      timeout-minutes: 8
      run: |
        sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
        sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg mkvtoolnix

    - name: Install media tools (macOS)
      if: runner.os == 'macOS'
      run: brew install ffmpeg mkvtoolnix

    - name: Run Python regression tests
      run: uv run --group build python -m unittest discover -s tests -v

    - name: Verify installed Python package
      if: runner.os == 'Linux'
      run: |
        uv build --wheel --out-dir build/packages
        uv run --group build python tests/smoke_package.py build/packages/syncforge-*-py3-none-any.whl

    - name: Build Executable with PyInstaller
      run: uv run --group build python scripts/build.py

    - name: Smoke-test bundled subtitle synchronizer
      run: uv run --group build python tests/smoke_bundle.py dist/${{ matrix.executable }}

    - name: Rename executable for specific OS
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        if [[ "$VERSION" != *.* ]]; then
          VERSION="${VERSION}.0"
        fi
        ASSET_NAME="SyncForge-${{ matrix.os_label }}-${VERSION}${{ matrix.ext }}"
        mv dist/${{ matrix.executable }} dist/$ASSET_NAME
        echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

    - name: Save release executable
      uses: actions/upload-artifact@v7
      with:
        name: SyncForge-${{ matrix.os_label }}
        path: dist/${{ env.ASSET_NAME }}
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        pattern: SyncForge-*
        path: release-assets
        merge-multiple: true
    - name: Read release title
      run: echo "RELEASE_TITLE=Ver $(sed -n 's/^## //p' CHANGELOG.md | head -n 1)" >> "$GITHUB_ENV"
    - name: Publish all platform executables
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        body_path: CHANGELOG.md
        name: ${{ env.RELEASE_TITLE }}
        draft: false
