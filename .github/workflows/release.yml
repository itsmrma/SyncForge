name: Build and Release

on:
  push:
    tags:
      - 'v*' # Si avvia in automatico quando pushi un nuovo tag (es. v1.2)

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            executable: SyncForge.exe
            os_label: Windows
            ext: .exe
          - os: ubuntu-latest
            executable: SyncForge
            os_label: Linux
            ext: ""
          - os: macos-latest
            executable: SyncForge
            os_label: macOS
            ext: ""

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --locked

    - name: Install media tools (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install mkvtoolnix ffmpeg -y --no-progress
        "$env:ProgramFiles\MKVToolNix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install media tools (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg mkvtoolnix

    - name: Install media tools (macOS)
      if: runner.os == 'macOS'
      run: brew install ffmpeg mkvtoolnix

    - name: Run Python regression tests
      run: uv run python -m unittest discover -s tests -v

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build Web GUI
      run: |
        cd web
        npm ci
        npm run lint
        npm run build

    - name: Run browser regression tests
      working-directory: web
      run: |
        npx playwright install --with-deps chromium
        npm test

    - name: Build Executable with PyInstaller
      run: uv run python build.py

    - name: Smoke-test bundled subtitle synchronizer
      run: uv run python tests/smoke_bundle.py dist/${{ matrix.executable }}

    - name: Rename executable for specific OS
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        ASSET_NAME="SyncForge-${{ matrix.os_label }}-${VERSION}${{ matrix.ext }}"
        mv dist/${{ matrix.executable }} dist/$ASSET_NAME
        echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

    - name: Save release executable
      uses: actions/upload-artifact@v4
      with:
        name: SyncForge-${{ matrix.os_label }}
        path: dist/${{ env.ASSET_NAME }}
        if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true
    - name: Publish all platform executables
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        body_path: CHANGELOG.md
        draft: false
