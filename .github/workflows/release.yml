name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Build and test Web GUI
      working-directory: web
      run: |
        npm ci
        npm run lint
        npm run build
        npx playwright install --with-deps --only-shell chromium
        npm test
    - uses: actions/upload-artifact@v4
      with:
        name: web-frontend
        path: web/dist/
        if-no-files-found: error
        retention-days: 7

  build:
    name: Build on ${{ matrix.os_label }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows
          - os: ubuntu-22.04
            os_label: Linux
          - os: macos-latest
            os_label: macOS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Restore tested frontend
      uses: actions/download-artifact@v4
      with:
        name: web-frontend
        path: web/dist/

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev || sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libappindicator3-dev

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install web dependencies
      working-directory: web
      run: npm ci

    - name: Run Rust regression and integration tests
      run: cargo test --workspace

    - name: Build Tauri application
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "macOS" ]; then
          npx --prefix web tauri build --bundles app
        else
          npx --prefix web tauri build --no-bundle
        fi

    - name: Package direct standalone executables (No installer)
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        if [[ "$VERSION" != *.* ]]; then
          VERSION="${VERSION}.0"
        fi
        mkdir -p dist
        if [ "${{ runner.os }}" = "macOS" ]; then
          # Ad-hoc sign the entire app bundle to seal Info.plist and Resources
          codesign --force --deep -s - target/release/bundle/macos/SyncForge.app
          # Create single-file .dmg disk image containing SyncForge.app directly
          hdiutil create -volname "SyncForge" -srcfolder target/release/bundle/macos/SyncForge.app -ov -format UDZO "dist/SyncForge-macOS-${VERSION}.dmg"
          # Package .app preserving macOS permissions and resource forks
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/SyncForge.app "dist/SyncForge-macOS-${VERSION}-app.zip"
          tar -czvf "dist/SyncForge-macOS-${VERSION}.tar.gz" -C target/release/bundle/macos SyncForge.app
        elif [ "${{ runner.os }}" = "Windows" ]; then
          # Standalone direct .exe
          cp target/release/SyncForge.exe "dist/SyncForge-Windows-${VERSION}.exe"
        else
          # Standalone direct Linux binary
          cp target/release/SyncForge "dist/SyncForge-Linux-${VERSION}"
          chmod +x "dist/SyncForge-Linux-${VERSION}"
          tar -czvf "dist/SyncForge-Linux-${VERSION}.tar.gz" -C target/release SyncForge
        fi

    - name: Save release assets
      uses: actions/upload-artifact@v4
      with:
        name: SyncForge-${{ matrix.os_label }}
        path: dist/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: SyncForge-*
        path: release-assets
        merge-multiple: true
    - name: Read release title
      run: echo "RELEASE_TITLE=Ver $(sed -n 's/^## //p' CHANGELOG.md | head -n 1)" >> "$GITHUB_ENV"
    - name: Publish all platform executables
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        body_path: CHANGELOG.md
        name: ${{ env.RELEASE_TITLE }}
        draft: false
