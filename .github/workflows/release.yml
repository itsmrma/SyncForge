name: Build and Release

on:
  push:
    tags:
      - 'v*' # Si avvia in automatico quando pushi un nuovo tag (es. v1.2)

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            executable: SyncForge.exe
            os_label: Windows
            ext: .exe
          - os: ubuntu-latest
            executable: SyncForge
            os_label: Linux
            ext: ""
          - os: macos-latest
            executable: SyncForge
            os_label: macOS
            ext: ""

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Web GUI
      run: |
        cd web
        npm install
        npm run build

    - name: Build Executable with PyInstaller
      run: uv run python build.py

    - name: Rename executable for specific OS
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        ASSET_NAME="SyncForge-${{ matrix.os_label }}-${VERSION}${{ matrix.ext }}"
        mv dist/${{ matrix.executable }} dist/$ASSET_NAME
        echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: dist/${{ env.ASSET_NAME }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
