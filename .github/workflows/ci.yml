name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-mcp:
    name: Frontend & MCP Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Lint Web GUI (oxlint)
        working-directory: web
        run: npm run lint

      - name: Test release packaging and update manifest
        run: node --test scripts/create-update-manifest.test.mjs scripts/release-build.test.mjs

      - name: Build Web GUI (Vite)
        working-directory: web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run Web tests (Playwright)
        working-directory: web
        run: npm test

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Run MCP integration tests
        working-directory: mcp
        run: npm test

  rust-backend:
    name: Rust Backend Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev || sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libappindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check workspace
        run: cargo check --workspace

      - name: Cargo check standalone CLI (no-default-features)
        run: cargo check --no-default-features --bin syncforge-cli

      - name: Run Rust tests
        run: cargo test --workspace
